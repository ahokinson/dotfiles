# Reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Sanity
set -g prefix C-b
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# Vim-like
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
 
bind X confirm-before kill-session
bind c new-window -c "#{pane_current_path}"

# Catppuccin
set -g default-terminal "tmux-256color"
# Forward 24-bit colour to ghostty (paired with CLAUDE_CODE_TMUX_TRUECOLOR=1 in zsh).
set -as terminal-features ",xterm-ghostty:RGB"
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Override AFTER catppuccin loads. Detailed Pharos activity lives in the
# auto-hiding sidecard; the normal tmux bar stays focused on tabs/system info.
set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_mauve}] #I #[fg=#{@thm_fg},bg=#{@thm_surface_1}] #W #[default]"
set -g window-status-format "#[fg=#{@thm_crust},bg=#{@thm_overlay_2}] #I #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #W #[default]"

set -g status-left-length 100
set -g status-right-length 20
set -g status-left " "
set -g status-right " "
set -g status on
set -g status-position bottom
set -gu status-format[1]
set -gu status-format[2]

# Start (or replace) the per-session card controller whenever a client joins,
# and also after this config is reloaded in the currently attached session.
# q: is load-bearing: run-shell expands the format and then hands the result
# to sh, and a tmux session id looks like "$1", which sh eats as a positional
# parameter. Without q: the controller is invoked with no argument at all.
set-hook -g client-attached 'run-shell -b "~/.config/tmux/pharos #{q:session_id}"'
run-shell -b "~/.config/tmux/pharos #{q:session_id}"
