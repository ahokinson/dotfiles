# Reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Sanity
set -g prefix C-b
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# Vim-like
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
 
bind X confirm-before kill-session
bind c new-window -c "#{pane_current_path}"

# Catppuccin
set -g default-terminal "tmux-256color"
# Forward 24-bit colour to ghostty (paired with CLAUDE_CODE_TMUX_TRUECOLOR=1 in zsh).
set -as terminal-features ",xterm-ghostty:RGB"
set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "basic"

# @claude_frame holds the animated pulse rendered by `pharos tmux pulse`.
# Appended after the last tab (window_end_flag) so it sits right after the tabs.

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Override AFTER catppuccin loads. Tabs keep catppuccin's basic look; only the
# pulse is appended after the last tab.
set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_mauve}] #I #[fg=#{@thm_fg},bg=#{@thm_surface_1}] #W #[default]#{?window_end_flag,#{?@claude_frame, #{@claude_frame},},}"
set -g window-status-format "#[fg=#{@thm_crust},bg=#{@thm_overlay_2}] #I #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #W #[default]#{?window_end_flag,#{?@claude_frame, #{@claude_frame},},}"

set -g status-left-length 100
set -g status-right-length 100
set -g status-left " "
set -g status-right " "
