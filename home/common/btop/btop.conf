# btop configuration - only non-default settings

# Theme
color_theme = "$HOME/.config/btop/themes/catppuccin_frappe.theme"
theme_background = True
truecolor = True

# Display
rounded_corners = True
graph_symbol = "braille"
shown_boxes = "cpu mem net proc"
update_ms = 2000
clock_format = "%X"

# Process list
proc_sorting = "cpu lazy"
proc_mem_bytes = True
proc_cpu_graphs = True

# CPU
cpu_invert_lower = True
show_uptime = True
check_temp = True
show_coretemp = True
show_cpu_freq = True

# Memory
mem_graphs = True
show_swap = True
swap_disk = True
show_disks = True
use_fstab = True

# Network
net_auto = True
net_sync = True

# Battery
show_battery = True
show_battery_watts = True
