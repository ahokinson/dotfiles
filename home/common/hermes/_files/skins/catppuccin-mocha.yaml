  [#fab387] ███████║█████╗  ██████╔╝██╔████╔██║█████╗  ███████╗[/]
  [#f2a999] ██╔══██║██╔══╝  ██╔══██╗██║╚██╔╝██║██╔══╝  ╚════██║[/]
