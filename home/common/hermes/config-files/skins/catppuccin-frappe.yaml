# Catppuccin Frappé skin for Hermes CLI
# Palette reference: https://github.com/catppuccin/catppuccin
#   Base #303446  Mantle #292c3c  Crust #232634
#   Text #c6d0f5  Subtext1 #b5bfe2  Subtext0 #a5adce
#   Overlay2 #949cbb  Overlay1 #838ba7  Overlay0 #737994
#   Surface2 #626880  Surface1 #51576d  Surface0 #414559
#   Blue #8caaee  Lavender #babbf1  Sapphire #85c1dc  Sky #99d1db  Teal #81c8be
#   Green #a6d189  Yellow #e5c890  Peach #ef9f76  Maroon #ea999c  Red #e78284
#   Mauve #ca9ee6  Pink #f4b8e4  Flamingo #eebebe  Rosewater #f2d5cf
name: catppuccin-frappe
description: Catppuccin Frappé, soft dark pastel theme

colors:
  # Banner / panels
  banner_border: "#8caaee" # Blue
  banner_title: "#babbf1" # Lavender
  banner_accent: "#ca9ee6" # Mauve
  banner_dim: "#a5adce" # Subtext0 (lifted for readable category labels)
  banner_text: "#c6d0f5" # Text

  # General UI
  ui_accent: "#8caaee" # Blue
  ui_label: "#babbf1" # Lavender
  ui_ok: "#a6d189" # Green
  ui_error: "#e78284" # Red
  ui_warn: "#e5c890" # Yellow

  # Prompt / input
  prompt: "#c6d0f5" # Text
  input_rule: "#51576d" # Surface1
  response_border: "#8caaee" # Blue

  # Session labels
  session_label: "#babbf1" # Lavender
  session_border: "#737994" # Overlay0

  # Status / usage bar
  status_bar_bg: "#292c3c" # Mantle
  status_bar_text: "#c6d0f5" # Text
  status_bar_strong: "#babbf1" # Lavender
  status_bar_dim: "#737994" # Overlay0
  status_bar_good: "#a6d189" # Green
  status_bar_warn: "#e5c890" # Yellow
  status_bar_bad: "#ef9f76" # Peach
  status_bar_critical: "#e78284" # Red

  # TUI extras
  # Popup menus float ABOVE the base (#303446), so they use Surface tones
  # (lighter than base) to stand out, not Mantle/Crust, which sit behind base
  # and made the menus read as a murky dark blob.
  voice_status_bg: "#292c3c" # Mantle
  selection_bg: "#626880" # Surface2
  completion_menu_bg: "#414559" # Surface0 (lifted from Mantle)
  completion_menu_current_bg: "#737994" # Overlay0, clear highlight vs menu bg
  completion_menu_meta_bg: "#51576d" # Surface1
  completion_menu_meta_current_bg: "#626880" # Surface2

branding:
  agent_name: "Hermes Agent"
  welcome: "Welcome to Hermes Agent! Type your message or /help for commands."
  goodbye: "Goodbye! ⚕"
  response_label: " ⚕ Hermes "
  prompt_symbol: "❯"
  help_header: "(=^･ω･^=) Available Commands"

tool_prefix: "┊"

