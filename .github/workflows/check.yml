# Evaluation and lint only; nothing is built. Evaluating a darwin drvPath
# from Linux is fine, only realising it needs a matching platform, so one
# ubuntu runner covers all six configurations.
name: check

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      # darwinConfigurations is not a standard flake output, so this skips it
      # and the loop below covers it.
      - name: nix flake check
        run: nix flake check --show-trace

      # Host names come from the flake, so a seventh configuration cannot
      # escape CI, and the Asahi skip keys off a property they declare rather
      # than their names. Those two only evaluate on the real hardware:
      # hardware.asahi.enable pulls in firmware extracted from that machine's
      # macOS install, and their hardware-configuration.nix is a placeholder
      # with no fileSystems until nixos-generate-config runs there.
      - name: Evaluate every host configuration
        run: |
          set -euo pipefail
          for kind in nixosConfigurations darwinConfigurations; do
            for name in $(nix eval --json ".#$kind" --apply builtins.attrNames | jq -r '.[]'); do
              if [ "$(nix eval --json ".#$kind.$name" \
                    --apply 'c: c.config.hardware.asahi.enable or false')" = "true" ]; then
                echo "::notice::skipping $kind.$name (Asahi: needs on-machine firmware and a real hardware-configuration.nix)"
                continue
              fi
              echo "::group::$kind.$name"
              nix eval --raw ".#$kind.$name.config.system.build.toplevel.drvPath"
              echo
              echo "::endgroup::"
            done
          done
